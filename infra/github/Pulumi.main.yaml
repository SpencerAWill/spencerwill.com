config:
  github:owner: SpencerAWill
  spencerwill-shared-github:repository: spencerwill.com
  spencerwill-shared-github:description: "Shared infrastructure for spencerwill.com: the Resend sending domain, root email DNS, and other zone- and account-wide settings"
  # Public, which is what lets `prod` require a reviewer on GitHub Free.
  spencerwill-shared-github:visibility: public
  # The aggregate job in ci.yml; it waits on every `check:` job, so renaming
  # one of those never breaks the ruleset.
  spencerwill-shared-github:requiredChecks: '["required"]'
  # Who approves every job that gets a Pulumi token: PR previews and
  # `deploy: prod` (GitHub user ids: gh api users/<login> -q .id).
  spencerwill-shared-github:reviewerIds: "[43732866]"
  # Turns on ci.yml's Pulumi jobs, `preview` and `deploy` (the
  # PULUMI_CI_ENABLED repo variable). Needs the CI secrets; see "First-time
  # setup" in the README.
  spencerwill-shared-github:pulumiCiEnabled: "true"
  # The Pulumi Cloud organization ci.yml logs in to through OIDC, and whose
  # personal token its jobs get. Also written to the PULUMI_ORGANIZATION and
  # PULUMI_USER_LOGIN repo variables, which ci.yml's pulumi/auth-actions
  # steps read.
  spencerwill-shared-github:pulumiOrganization: SpencerAWill
  spencerwill-shared-github:pulumiUserLogin: SpencerAWill
  # Other repos that log in through the same OIDC issuer (Pulumi Cloud allows
  # one per GitHub URL), as "<owner>/<repo>": [<GitHub environments>]. Add a
  # repo here and apply this stack before its workflows switch to OIDC.
  # Example: '{"SpencerAWill/ucmc.spencerwill.com": ["dev", "prod"]}'
  spencerwill-shared-github:pulumiOidcRepositories: "{}"
  # Where the CI tokens are minted, and the zone their zone permissions are
  # scoped to. Same values as infra/cloudflare's prod stack. Minting runs only
  # once `cloudflare:apiToken` is set here (as a secret).
  spencerwill-shared-github:cloudflareAccountId: d57880630b3277f59331318b53f323b6
  spencerwill-shared-github:cloudflareZoneId: 6bfb4d1d3134e6d765aef413094cd28f
  cloudflare:apiToken:
    secure: AAABAPb1gfn4iA6CYZoa1S5pkk6YZ+5pro5bsSWddjyFzzzpve97vJka6pc+g/mlcX3RFvsPCx5sjvPORMiN6XhHIEdZrjwaVS3/uaOTtOy7Z9T+1Q==
